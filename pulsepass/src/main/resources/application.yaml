spring:
  application:
    name: pulsepass

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  datasource:
    url: jdbc:postgresql://localhost:5432/pulsepass_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver